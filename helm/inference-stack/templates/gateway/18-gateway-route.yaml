{{- if and .Values.global.serviceCABundle .Values.maasUseRoute }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: maas-gateway-route
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "18"
spec:
  host: maas{{ .Values.global.clusterBaseUrl }}
  to:
    kind: Service
    name: maas-default-gateway-openshift-default
    weight: 100
  port:
    targetPort: 443
  tls:
    termination: {{ .Values.maasRouteConfig.termination }}
    insecureEdgeTerminationPolicy: Redirect
{{- if .Values.global.serviceCABundle }}
    destinationCACertificate: |
{{ .Values.global.serviceCABundle | trim | indent 6 }}
{{- end }}
{{- end }}
