{{- if hasKey .Values "addSelfSignedCerts" }}
{{- fail "addSelfSignedCerts was renamed to enableSelfSignedCertsApp" }}
{{- end }}
{{- if .Values.enableSelfSignedCertsApp }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: self-signed-certs
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  destination:
    name: in-cluster
    namespace: openshift-gitops
  source:
    path: helm/self-signed-certs
    repoURL: https://github.com/redhat-ai-americas/rhoai-argo.git
    targetRevision: maas-20260930
    helm:
      valuesObject:
        global:
          {{- .Values.global | toYaml | nindent 10 -}}
{{- if .Values.configuration.selfSignedCertsApp -}}
{{- .Values.configuration.selfSignedCertsApp | toYaml | nindent 8 }}
{{- end }}
  project: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: false 
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: openshift-gitops
{{- end }}