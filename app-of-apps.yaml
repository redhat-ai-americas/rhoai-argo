apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhoai-app-of-apps
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/redhat-ai-americas/rhoai-argo.git
    path: argocd-applications
    targetRevision: maas
    helm:
      valuesObject:
        global:
          clusterBaseUrl: ''
          serviceCABundle: ''
        installPlanApproval: Manual
        addSelfSignedCerts: true
        externalDatabase: &externalDatabase false
        configuration:
          inferenceApp:
            maasIngressCertSecret: cert-manager-ingress-cert
            rhclVersion: rhcl-operator.v1.3.4
          gpuApp:
            nvidiaGpuChannel: "v25.10"
            nvidiaGpuVersion: 'gpu-operator-certified.v25.10.1'
            nvidiaGpuDriverVersion: 580.126.20
          rhoaiApp:
            externalDatabase: *externalDatabase
            rhoaiChannel: "stable-3.4"
            rhoaiVersion: "rhods-operator.3.4.3"
          observabilityApp:
            cooVersion: cluster-observability-operator.v1.4.0
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated: {}
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true