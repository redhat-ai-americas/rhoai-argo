apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhoai-app-of-apps
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/redhat-ai-americas/rhoai-argo.git
    path: argocd-applications
    targetRevision: maas
    helm:
      # Child Applications use the same repo and revision as this one.
      parameters:
        - name: git.repoURL
          value: $ARGOCD_APP_SOURCE_REPO_URL
        - name: git.targetRevision
          value: $ARGOCD_APP_SOURCE_TARGET_REVISION
      valuesObject:
        global:
          clusterBaseUrl: ''
          serviceCABundle: ''
        installPlanApproval: Manual
        enableDatabaseApp: true
        enableGpuApp: true
        enableInfrastructureApp: true
        enableMaasApp: true
        enableObservabilityApp: true
        enableRhoaiApp: true
        enableWorkloadScalingApp: true
        enableSelfSignedCertsApp: true
        configuration:
          maasApp:
            maasIngressCertSecret: cert-manager-ingress-cert
            rhclVersion: rhcl-operator.v1.4.3
            maasRoute: true
          gpuApp:
            nvidiaGpuChannel: "stable"
            nvidiaGpuVersion: 'gpu-operator-certified.v26.7.0'
            nvidiaGpuDriverVersion: 615.71.09
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated: {}
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true